name: App

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release

      - name: Package
        run: |
          cp -R linux/packaging build/linux/x64/release/bundle/packaging
          tar -czf nearby-linux-x64.tar.gz -C build/linux/x64/release --transform 's,^bundle,nearby,' bundle

      - uses: actions/upload-artifact@v7
        with:
          name: nearby-linux-x64
          path: app/nearby-linux-x64.tar.gz
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - run: flutter pub get
      - run: flutter build apk --release

      # The Gradle wrapper exists once Flutter has built the app.
      - name: Kotlin unit tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: nearby-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
